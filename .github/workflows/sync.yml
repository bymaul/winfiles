name: sync

on:
  push:
    branches: [master]
    paths:
      - "nvim/**"
      - "starship/**"
      - "bat/**"
      - "lazygit/**"
      - "fastfetch/**"
      - "wsl/zsh/**"
      - "wsl/tmux/**"
      - "wsl/opencode/**"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      OTHER_REPO: bymaul/dotfiles
      SYNC_BRANCH: sync/from-winfiles

    steps:
      - name: Check target repository
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_TOKEN secret is not set; skipping sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh repo view "$OTHER_REPO" >/dev/null 2>&1; then
            echo "::warning::Target repository $OTHER_REPO is not reachable; skipping sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout winfiles
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Checkout dotfiles
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OTHER_REPO }}
          token: ${{ secrets.GH_TOKEN }}
          path: other

      - name: Sync shared configs
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail

          sync_dir() {
            local src="$1"
            local dst="$2"

            mkdir -p "other/$dst"

            if [ -d "$src" ]; then
              rsync -a --delete "$src/" "other/$dst/"
            else
              echo "Source $src does not exist; removing other/$dst"
              rm -rf "other/$dst"
            fi
          }

          # <source> <destination>
          sync_dir nvim nvim
          sync_dir starship starship
          sync_dir bat bat
          sync_dir lazygit lazygit
          sync_dir fastfetch fastfetch
          sync_dir wsl/opencode opencode
          sync_dir wsl/zsh zsh
          sync_dir wsl/tmux tmux

      - name: Create sync branch
        if: steps.check.outputs.skip != 'true'
        working-directory: other
        run: |
          set -euo pipefail

          git config user.name "sync[bot]"
          git config user.email "sync[bot]@users.noreply.github.com"

          git fetch origin master

          git checkout -B "$SYNC_BRANCH" origin/master

      - name: Commit and push changes
        if: steps.check.outputs.skip != 'true'
        working-directory: other
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync"
            exit 0
          fi

          git add -A
          git commit -m "chore: sync shared configs from bymaul/winfiles"
          git push --force origin "$SYNC_BRANCH"

      - name: Open or update sync PR
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          PR=$(gh pr list \
            --repo "$OTHER_REPO" \
            --head "$SYNC_BRANCH" \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$PR" ]; then
            echo "Sync PR already exists: #$PR"
            exit 0
          fi

          PR=$(gh pr create \
            --repo "$OTHER_REPO" \
            --base master \
            --head "$SYNC_BRANCH" \
            --title "chore: sync shared configs from bymaul/winfiles" \
            --body "Auto-synced shared configs from bymaul/winfiles.")

          echo "Created PR: $PR"

      - name: Enable auto-merge
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          PR=$(gh pr list \
            --repo "$OTHER_REPO" \
            --head "$SYNC_BRANCH" \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR" ]; then
            echo "No open sync PR"
            exit 0
          fi

          gh pr merge "$PR" \
            --repo "$OTHER_REPO" \
            --squash \
            --auto
